<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OWS Mock - Part 1 of 42</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f4f6fa; color: #1d2433; }
  header { position: sticky; top: 0; z-index: 10; background: #1f3a5f; color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { font-size: 13px; opacity: .85; }
  #timer { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; background: #fff; color: #1f3a5f; padding: 4px 12px; border-radius: 8px; }
  #timer.warn { color: #b42318; }
  main { max-width: 820px; margin: 16px auto; padding: 0 12px; }
  .q { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .q .num { font-size: 13px; color: #5a6478; margin-bottom: 4px; }
  .q .phrase { font-size: 16px; margin-bottom: 10px; line-height: 1.4; }
  .opts label { display: block; padding: 8px 10px; border: 1px solid #d5dbe6; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  .opts label:hover { background: #eef3fb; }
  .opts input { margin-right: 8px; }
  .submitbar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #d5dbe6; padding: 12px; text-align: center; }
  button { background: #1f3a5f; color: #fff; border: 0; padding: 10px 28px; font-size: 16px; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #98a2b3; cursor: default; }
  #result { max-width: 820px; margin: 16px auto; padding: 0 12px 40px; }
  .summary { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .summary .score { font-size: 28px; font-weight: 700; color: #1f3a5f; }
  .summary p { margin: 4px 0; }
  .rev { background: #fff; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; border-left: 5px solid #98a2b3; }
  .rev.right { border-left-color: #12805c; }
  .rev.wrong { border-left-color: #b42318; }
  .rev.skip { border-left-color: #98a2b3; }
  .rev .ans { font-size: 14px; margin-top: 4px; }
  .correct-opt { color: #12805c; font-weight: 600; }
  .wrong-opt { color: #b42318; text-decoration: line-through; }
</style>
</head>
<body>

<header>
  <div>
    <h1>OWS Mock Test - Part 1 of 42</h1>
    <div class="meta">50 questions &middot; 15 minutes &middot; +2 correct &middot; -0.5 wrong &middot; 0 unattempted</div>
  </div>
  <div id="timer">15:00</div>
</header>

<main id="test"></main>

<div class="submitbar" id="submitBar">
  <button id="submitBtn">Submit Test</button>
</div>

<section id="result" hidden></section>

<script>
// Each item: [phrase, [four options], index of correct option]
const Q = [
["To become less intense or widespread",["Abet","Abate","Abjure","Abrade"],1],
["A place where animals are slaughtered for consumption as food",["Abbey","Abattoir","Aviary","Apiary"],1],
["The head of a monastery",["Vicar","Dean","Abbot","Deacon"],2],
["A shortened form of a word or phrase",["Abridgement","Anagram","Abbreviation","Alias"],2],
["To give up one's authority or throne",["Abjure","Abdicate","Abrogate","Abscond"],1],
["The act of giving up the throne or authority",["Abduction","Abdication","Abrasion","Abjection"],1],
["Deviation from the right course",["Abstraction","Aberration","Abjection","Abrasion"],1],
["A state of temporary suspension or inactivity",["Abidance","Abeyance","Abatement","Abstinence"],1],
["The act of washing oneself, especially as a religious rite",["Absolution","Ablution","Abrasion","Abnegation"],1],
["To renounce or give up a right or belief",["Abrogate","Abnegate","Abdicate","Abjure"],1],
["To formally put an end to a system, practice, or institution",["Abridge","Abolish","Abscond","Abet"],1],
["Relating to the original inhabitants of a place",["Ancestral","Abnormal","Aboriginal","Alluvial"],2],
["The original inhabitant or native of a country",["Alien","Aborigine","Emigrant","Immigrant"],1],
["To shorten a piece of writing without losing the sense",["Abrade","Abridge","Abrogate","Abscond"],1],
["A shortened version of a larger work",["Anthology","Abridgement","Alibi","Annotation"],1],
["To cancel or do away with a law or agreement",["Abdicate","Abrogate","Arrogate","Abrade"],1],
["To go away suddenly and secretly in order to escape",["Absolve","Abstain","Abscond","Absorb"],2],
["The formal forgiveness of a person's sins",["Absolution","Ablution","Abjuration","Absorption"],0],
["Wildly unreasonable, illogical or ridiculous",["Abject","Absurd","Abstruse","Abrupt"],1],
["A deep and seemingly bottomless pit or hole",["Abyss","Abbey","Aviary","Acme"],0],
["To increase the speed",["Accelerate","Abate","Ameliorate","Alleviate"],0],
["An unexpected event that causes injury or death",["Incident","Avalanche","Accident","Affliction"],2],
["An award, honour, or laudatory notice granted as special recognition",["Accolade","Anecdote","Accomplice","Adulation"],0],
["A person who helps another commit a crime",["Accountant","Accomplice","Accolade","Acolyte"],1],
["The successful completion of a task or goal",["Acquittal","Acumen","Accomplishment","Accretion"],2],
["To be harmonious or consistent with",["Accost","Accord","Accrue","Accretion"],1],
["A person whose profession is to keep and inspect financial records",["Actuary","Adjutant","Accountant","Abbot"],2],
["Sharp and bitter in speech or temperament",["Acoustic","Acerbic","Acrobatic","Aquatic"],1],
["The scientific study of sound",["Acoustics","Acumen","Aesthetics","Astronomy"],0],
["To decide and state officially in court that somebody is not guilty",["Abjure","Accrue","Admonish","Acquit"],3],
["A judgement that a person is not guilty of the crime charged",["Acquittal","Absolution","Acquiescence","Accolade"],0],
["A person who performs difficult gymnastic feats for entertainment",["Acrobat","Aviator","Acolyte","Athlete"],0],
["A word formed from the initial letters of other words and pronounced as a word",["Anagram","Acronym","Palindrome","Abbreviation"],1],
["An extreme fear of heights",["Agoraphobia","Acrophobia","Claustrophobia","Hydrophobia"],1],
["Giving cause for legal proceedings",["Actionable","Actuarial","Admissible","Accountable"],0],
["The ability to make good judgements and take quick decisions",["Ardour","Acumen","Avarice","Aplomb"],1],
["A person who is unable to stop using a harmful substance",["Adherent","Addict","Adjunct","Acolyte"],1],
["To speak formally; to deliver a speech; details of a person's location",["Address","Adjust","Adorn","Adduce"],0],
["To believe in and follow a rule, belief, or plan",["Abhor","Adjure","Adhere","Adduce"],2],
["The period between the beginning of puberty and adulthood",["Senescence","Adolescence","Infancy","Maturity"],1],
["An extremely handsome young man",["Narcissus","Adonis","Ganymede","Cupid"],1],
["Extremely attractive and lovable",["Admirable","Adorable","Amiable","Affable"],1],
["To make impure by adding inferior substances",["Adulterate","Alloy","Amalgamate","Aerate"],0],
["Willing to take risks and try new ideas",["Advantageous","Adventurous","Acquisitive","Austere"],1],
["A person who publicly supports or speaks in favour of a cause; a lawyer",["Adjunct","Advocate","Apologist","Arbitrator"],1],
["Existing or living in the air",["Arterial","Aerial","Aquatic","Arboreal"],1],
["An irrational and intense fear of flying",["Aerophobia","Acrophobia","Agoraphobia","Aquaphobia"],0],
["A person who has a strong appreciation for beauty and art",["Ascetic","Aesthete","Aesthetic","Acolyte"],1],
["Concerned with beauty or the appreciation of beauty",["Ascetic","Anesthetic","Aesthetic","Athletic"],2],
["The study of beauty and art",["Acoustics","Aesthetics","Aerobics","Astrology"],1]
];

const DURATION = 15 * 60;
let remaining = DURATION;
let timerId = null;
let finished = false;

const testEl = document.getElementById("test");
const timerEl = document.getElementById("timer");
const submitBtn = document.getElementById("submitBtn");
const resultEl = document.getElementById("result");

// Build questions
Q.forEach((item, i) => {
  const div = document.createElement("div");
  div.className = "q";
  let html = '<div class="num">Q' + (i + 1) + '</div>';
  html += '<div class="phrase">' + item[0] + '</div>';
  html += '<div class="opts">';
  item[1].forEach((opt, j) => {
    html += '<label><input type="radio" name="q' + i + '" value="' + j + '">' + opt + '</label>';
  });
  html += '</div>';
  div.innerHTML = html;
  testEl.appendChild(div);
});

function formatTime(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

function tick() {
  remaining--;
  timerEl.textContent = formatTime(remaining);
  if (remaining <= 60) timerEl.classList.add("warn");
  if (remaining <= 0) submitTest(true);
}

function getAnswer(i) {
  const checked = document.querySelector('input[name="q' + i + '"]:checked');
  return checked ? parseInt(checked.value, 10) : null;
}

function submitTest(auto) {
  if (finished) return;
  if (!auto && !confirm("Submit the test now?")) return;
  finished = true;
  clearInterval(timerId);
  document.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
  submitBtn.disabled = true;
  document.getElementById("submitBar").hidden = true;

  let right = 0, wrong = 0, skipped = 0;
  const rows = [];

  Q.forEach((item, i) => {
    const ans = getAnswer(i);
    const correct = item[2];
    let status;
    if (ans === null) { skipped++; status = "skip"; }
    else if (ans === correct) { right++; status = "right"; }
    else { wrong++; status = "wrong"; }

    const optsHtml = item[1].map((opt, j) => {
      let cls = "";
      if (j === correct) cls = "correct-opt";
      else if (j === ans && ans !== correct) cls = "wrong-opt";
      return '<span class="' + cls + '">' + opt + '</span>';
    }).join(" &middot; ");

    const yourText = ans === null ? "Not attempted" : item[1][ans];
    rows.push(
      '<div class="rev ' + status + '">' +
      '<div><strong>Q' + (i + 1) + '.</strong> ' + item[0] + '</div>' +
      '<div class="ans">Your answer: ' + yourText + ' &nbsp;|&nbsp; Correct: <span class="correct-opt">' + item[1][correct] + '</span></div>' +
      '<div class="ans">Options: ' + optsHtml + '</div>' +
      '</div>'
    );
  });

  const score = right * 2 - wrong * 0.5;
  resultEl.innerHTML =
    '<div class="summary">' +
    '<div class="score">Score: ' + score + ' / 100</div>' +
    '<p>Correct: ' + right + ' (+' + (right * 2) + ')</p>' +
    '<p>Wrong: ' + wrong + ' (-' + (wrong * 0.5) + ')</p>' +
    '<p>Unattempted: ' + skipped + ' (0)</p>' +
    (auto ? '<p><em>Time is up. Test auto-submitted.</em></p>' : '') +
    '</div>' +
    '<h2>Review</h2>' + rows.join("");
  resultEl.hidden = false;
  resultEl.scrollIntoView({ behavior: "smooth" });
}

submitBtn.addEventListener("click", () => submitTest(false));
timerEl.textContent = formatTime(remaining);
timerId = setInterval(tick, 1000);
</script>
</body>
</html>
